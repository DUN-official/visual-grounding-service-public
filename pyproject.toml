[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mie1077-visual-grounding-service"
version = "0.6.0"
description = "Adaptive visual grounding for robot-vision perception"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "David Nkwo"}]
keywords = ["visual grounding", "robotics", "OWL-ViT", "YOLO", "FastAPI", "Streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]
yolo = ["ultralytics==8.4.104"]
owlvit = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "accelerate>=0.34,<2",
]
gpt = ["openai>=1.50,<3"]
provision = ["huggingface-hub>=0.24,<2"]
video = [
    "opencv-contrib-python-headless>=4.10,<5",
    "imageio-ffmpeg>=0.5,<1",
    "httpx>=0.27,<1",
]
streamlit = [
    "streamlit==1.59.2",
    "streamlit-webrtc==0.76.2",
    "av>=14,<17",
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
]

[project.scripts]
grounding-service = "grounding.cli:serve"
ground-image = "grounding.cli:ground_image"
grounding-provision-models = "grounding.provisioning:main"
grounding-benchmark = "grounding.benchmark:main"
ground-video = "grounding.video_cli:ground_video"
ground-camera = "grounding.video_cli:ground_camera"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grounding = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["grounding"]
omit = ["src/grounding/streamlit_ui/*"]
